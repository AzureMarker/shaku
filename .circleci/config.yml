version: 2.1
commands:
  remove-rust-toolchain:
    steps:
      - run:
          name: "Remove rust-toolchain"
          command: rm rust-toolchain
  install-tools:
    steps:
      - run:
          name: "Install Tools"
          command: rustup component add rustfmt clippy
  style-check:
    steps:
      - run:
          name: "Code Style Check"
          command: cargo fmt -- --check
  lint-check:
    steps:
      - run:
          name: "Code Lint Check"
          command: cargo clippy --all-targets --all-features -- -D clippy::all
  code-check:
    parameters:
      check-args:
        type: string
        default: ""
    steps:
      - run:
          name: "Cargo Check"
          command: cargo check --all << parameters.check-args >>
  test:
    parameters:
      test-args:
        type: string
        default: ""
    steps:
      - run:
          name: "Test"
          command: cargo test --all << parameters.test-args >>
  ui-test:
    steps:
      - run:
          name: "Compiler Diagnostic Tests"
          command: |
            cargo test -p shaku --test shaku_ui
            cargo test -p shaku_derive --test shaku_derive_ui
jobs:
  shaku:
    docker:
      - image: rust:1.97.0
    steps:
      - checkout
      - remove-rust-toolchain
      - install-tools
      - style-check
      - lint-check
      - code-check
      - test:
          test-args: "-- --skip compile_fail"
      - ui-test
      - run:
          name: "Test with thread_safe off"
          working_directory: shaku
          command: cargo test --no-default-features --features derive -- --skip compile_fail
  shaku-msrv:
    docker:
      - image: rust:1.88.0
    steps:
      - checkout
      - remove-rust-toolchain
      - install-tools
      - run:
          name: "Use MSRV Cargo.lock"
          command: cp Cargo.lock.msrv Cargo.lock
      - code-check:
          check-args: "--locked"
      - run:
          name: "Test on MSRV (excluding compiler diagnostic snapshots)"
          command: cargo test --all --locked -- --skip compile_fail
workflows:
  version: 2
  build:
    jobs:
      - shaku
      - shaku-msrv
